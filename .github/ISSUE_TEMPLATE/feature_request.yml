name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, check open issues to avoid duplicates.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A brief description of the feature you are requesting.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature needed? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you think this could be implemented? Include a rough mcfunction sketch if you have one.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches you considered and why you ruled them out.
    validations:
      required: false

  - type: checkboxes
    id: compat
    attributes:
      label: Version Compatibility
      description: Should this feature support 1.18.2?
      options:
        - label: Must support 1.18.2+
        - label: 1.20.2+ acceptable
        - label: No preference
