name: Custom Issue
description: For anything that does not fit bug reports or feature requests
title: ""
labels: []
body:
  - type: textarea
    id: topic
    attributes:
      label: What is this about?
      description: Describe the topic of this issue clearly.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Provide as much context as needed.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Links, related issues, or relevant storage/scoreboard dumps if applicable.
    validations:
      required: false
